<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch · Streamer Search</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0f0f13;
      color: #f0f0f5;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .watch-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      background: #1a1a24;
      border-bottom: 1px solid #2e2e42;
      flex-wrap: wrap;
    }
    .watch-top a.logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #f0f0f5;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .watch-top .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ff0000, #9146ff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
    }
    .watch-title {
      flex: 1;
      min-width: 0;
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    .watch-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .watch-actions a,
    .watch-actions button {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-external {
      background: #9146ff;
      color: white;
    }
    .btn-external:hover {
      background: #7c3aed;
    }
    .btn-back {
      background: #242433;
      color: #f0f0f5;
      border: 1px solid #2e2e42;
    }
    .btn-back:hover {
      background: #2e2e42;
    }
    .watch-player {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-height: 0;
    }
    .watch-player iframe {
      width: 100%;
      height: 100%;
      min-height: 70vh;
      border: none;
    }
    .watch-error {
      text-align: center;
      padding: 60px 20px;
      color: #a0a0b8;
    }
    .watch-error a {
      color: #9146ff;
    }
    @media (max-width: 600px) {
      .watch-title {
        order: 3;
        width: 100%;
        text-align: left;
        margin-top: 4px;
      }
      .watch-player iframe {
        min-height: 50vh;
      }
    }
  </style>
</head>
<body>
  <header class="watch-top">
    <a class="logo" href="index.html">
      <span class="logo-icon">▶</span>
      Streamer Search
    </a>
    <div class="watch-title" id="watch-title">Loading…</div>
    <div class="watch-actions">
      <a class="btn-external" id="external-link" href="#" target="_blank" rel="noopener">Open original</a>
      <button class="btn-back" onclick="window.close()">Close tab</button>
    </div>
  </header>

  <main class="watch-player" id="player-area">
    <div class="watch-error" id="error" hidden>
      <p>Could not load the player.</p>
      <p><a href="index.html">← Back to search</a></p>
    </div>
  </main>

  <script>
    const INVIDIOUS_INSTANCES = [
      'https://invidious.f5.si',
      'https://yewtu.be',
      'https://inv.tux.pizza',
      'https://invidious.privacydev.net',
      'https://iv.melmac.space'
    ];

    const params = new URLSearchParams(location.search);
    const type = params.get('type'); // 'yt' | 'twitch'
    const id = params.get('id');
    const title = params.get('title') || 'Watching';
    const external = params.get('url') || '#';

    document.getElementById('watch-title').textContent = title;
    document.title = title + ' · Streamer Search';
    document.getElementById('external-link').href = external;

    const area = document.getElementById('player-area');
    const errorEl = document.getElementById('error');

    function showError() {
      errorEl.hidden = false;
    }

    if (!type || !id) {
      showError();
    } else if (type === 'yt') {
      // Prefer Invidious embed; fall back to YouTube if needed
      const inv = params.get('inv') || INVIDIOUS_INSTANCES[0];
      const iframe = document.createElement('iframe');
      iframe.src = inv + '/embed/' + encodeURIComponent(id) + '?autoplay=1';
      iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      iframe.allowFullscreen = true;
      iframe.title = title;
      area.insertBefore(iframe, errorEl);
    } else if (type === 'twitch') {
      const parent = location.hostname || 'localhost';
      const iframe = document.createElement('iframe');
      iframe.src = 'https://player.twitch.tv/?channel=' + encodeURIComponent(id) +
        '&parent=' + encodeURIComponent(parent) + '&autoplay=true';
      iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      iframe.allowFullscreen = true;
      iframe.title = title;
      area.insertBefore(iframe, errorEl);
    } else {
      showError();
    }
  </script>
</body>
</html>
